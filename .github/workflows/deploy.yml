name: Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy backend to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e
            unset HTTP_PROXY HTTPS_PROXY http_proxy https_proxy ALL_PROXY all_proxy

            cd "${{ secrets.PROJECT_PATH }}"
            for attempt in 1 2 3; do
              git fetch origin main && break
              if [ "$attempt" = "3" ]; then
                exit 1
              fi
              sleep 5
            done
            git reset --hard origin/main

            cd ai-job-backend
            npm ci
            npx prisma generate
            npx prisma migrate deploy
            npm run build

            if command -v pm2 >/dev/null 2>&1; then
              pm2 restart zhitou-backend || pm2 start npm --name zhitou-backend -- run start:prod
              pm2 save
            else
              echo "pm2 is not installed on the server. Install pm2 or replace this step with your server process manager."
              exit 1
            fi
